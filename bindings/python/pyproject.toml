[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name is "kolmoc" ("kolmo" is already taken on PyPI); the import name is still
# `import kolmo`, and everywhere else — the project, the crate, the CLI — it is "kolmo".
name = "kolmoc"
version = "1.0.1"
description = "kolmo — structure-aware lossless compressor: best ratio across tables, logs and scientific data, with decode that scales across cores. Installs as `kolmoc`, imports as `kolmo`."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Adnane Aqartit and contributors" }]
requires-python = ">=3.8"
keywords = ["compression", "lossless", "columnar", "zstd", "simd"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Archiving :: Compression",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/adnaneben/kolmo"
Repository = "https://github.com/adnaneben/kolmo"

[tool.setuptools]
py-modules = ["kolmo"]
