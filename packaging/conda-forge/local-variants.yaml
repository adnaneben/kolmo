# For local and CI test builds only (rattler-build -m packaging/conda-forge/local-variants.yaml). On conda-forge the
# global pinning (conda-forge-pinning) provides these; do not copy this file into staged-recipes.
c_compiler:
  - if: osx
    then: clang
    else: gcc
c_compiler_version:
  - if: osx
    then: "19"
    else: "14"
c_stdlib:
  - if: osx
    then: macosx_deployment_target
    else: sysroot
c_stdlib_version:
  - if: osx
    then: "11.0"
    else: "2.17"
python:
  - "3.12"
