name: wheels

# Builds the PyPI sdist and per-platform wheels for the Python binding, and (on a version tag)
# publishes them to PyPI via Trusted Publishing. The binding is pure-ctypes, so each platform
# gets one py3-none wheel that works on every Python 3. Publishing also runs on a manual
# workflow_dispatch; see RELEASING.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "bindings/python/**"
      - "src/**"
      - ".github/workflows/wheels.yml"

concurrency:
  group: wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdist:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync native sources into the package
        run: bash bindings/python/sync-native.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist --outdir dist bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS wheels are disabled: GitHub is not allocating macOS runners to this repo
          # (macos-14 reports "not supported"; macos-13 sits queued indefinitely). macOS users
          # install from the sdist, which builds locally in ~1 min. Re-enable this entry once a
          # macOS runner is available (it cross-compiles both archs on an Intel runner):
          # - os: macos-13
          #   arch: "x86_64 arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync native sources into the package
        run: bash bindings/python/sync-native.sh
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: "python -c \"import kolmo; d=b'col,val\\n'+b''.join(b'r,%d\\n'%i for i in range(5000)); assert kolmo.decompress(kolmo.compress(d, level=7))==d; print('wheel ok')\""
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    # Publishes to PyPI on a version tag. Configure a Trusted Publisher on PyPI for this repo
    # + workflow (no API token needed): https://docs.pypi.org/trusted-publishers/
    needs: [sdist, wheels]
    # Publishes on a version tag, or on a manual run (workflow_dispatch) — the version comes from
    # pyproject.toml, and PyPI Trusted Publishing matches on repo + workflow + environment, not on
    # the ref, so a manual run from main publishes the same artifacts.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing, and the Sigstore certificate for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # GitHub build provenance for the sdist and wheels (verify: gh attestation verify <file> --repo adnaneben/kolmo).
      # The PyPI upload below also attaches PEP 740 attestations, which PyPI shows on the file's page.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-running for a version that is already on PyPI (e.g. a tag pushed after a manual
          # publish) skips the existing files instead of failing the job.
          skip-existing: true
