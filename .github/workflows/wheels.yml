name: wheels

# Builds the PyPI sdist and per-platform wheels for the Python binding, and (on a version tag)
# publishes them to PyPI via Trusted Publishing. The binding is pure-ctypes, so each platform
# gets one py3-none wheel that works on every Python 3. Manual dispatch from a branch builds
# packages for inspection. Publish and retry from the matching version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "bindings/python/**"
      - "src/**"
      - ".github/workflows/wheels.yml"
      - ".github/scripts/release-source.sh"
      - ".github/scripts/pypi-release.py"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release identity
        id: v
        run: bash .github/scripts/release-source.sh
      - name: Sync native sources into the package
        run: bash bindings/python/sync-native.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist --outdir dist bindings/python
      - name: Verify sdist metadata
        run: python3 .github/scripts/pypi-release.py check dist "$(cat VERSION)" --kind sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS wheels are disabled: GitHub is not allocating macOS runners to this repo
          # (macos-14 reports "not supported"; macos-13 sits queued indefinitely). macOS users
          # install from the sdist, which builds locally in ~1 min. Re-enable this entry once a
          # macOS runner is available (it cross-compiles both archs on an Intel runner):
          # - os: macos-13
          #   arch: "x86_64 arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync native sources into the package
        run: bash bindings/python/sync-native.sh
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: "python -c \"import kolmo; d=b'col,val\\n'+b''.join(b'r,%d\\n'%i for i in range(5000)); assert kolmo.decompress(kolmo.compress(d, level=7))==d; print('wheel ok')\""
      - name: Verify wheel metadata
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/pypi-release.py check wheelhouse "$(cat VERSION)" --kind "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.sdist.outputs.version }}
      SOURCE_COMMIT: ${{ needs.sdist.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sdist.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Require matching packages and stage missing PyPI files
        id: packages
        run: |
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          # Verify the current remote tag before signing or publishing this commit.
          remote_commit=$(git ls-remote origin "$GITHUB_REF" "$GITHUB_REF^{}" |
            awk -v ref="$GITHUB_REF" '$2 == ref {tag = $1} $2 == (ref "^{}") {peeled = $1} END {print (peeled != "" ? peeled : tag)}')
          test "$remote_commit" = "$SOURCE_COMMIT"
          python3 .github/scripts/pypi-release.py prepare dist "$VERSION" --upload pending
          if compgen -G "pending/*" >/dev/null; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@v2
        if: steps.packages.outputs.upload == 'true'
        with:
          subject-path: dist/*
      - name: Verify the package attestations
        if: steps.packages.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wheels.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$SOURCE_COMMIT"
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.packages.outputs.upload == 'true'
        with:
          packages-dir: pending
      - name: Verify uploaded package digests
        run: python3 .github/scripts/pypi-release.py verify dist "$VERSION"
