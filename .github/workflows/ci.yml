name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      - name: dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install xz
      - name: build
        run: make -j4 ARCH=
      - name: tests (round trips in all modes, corruption fuzzing)
        run: make check
      - name: experimental FASTA and compact ultra frame compatibility
        run: make -j4 ARCH= check-frontier-dna check-cm-compact
      - name: shared library + Python binding round trip
        run: make -j4 ARCH= lib && python3 bindings/python/test_kolmo.py && python3 tests/test_concurrent_dict.py
      - name: Rust binding round trip
        run: cargo test --manifest-path bindings/rust/Cargo.toml
      - name: streaming round trip (multi-frame, bounded memory)
        run: |
          cat src/*.c src/*.inc README.md > s.in
          for i in 1 2 3 4; do cat s.in s.in > s2.in && mv s2.in s.in; done
          ./build/kolmo -m fast -S 2 s.in s.czs
          ./build/kolmo -d s.czs s.out
          cmp s.in s.out
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      - name: build vendor libraries
        run: make -j4 ARCH= build/libvendor.a
      - name: resource and concurrency regressions under ASan and UBSan
        run: make -j4 ARCH= check-sanitizers
      - name: address and undefined-behaviour sanitizers
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
            -DXXH_NAMESPACE=ZSTD_ -DZSTD_MULTITHREAD -DZSTD_LEGACY_SUPPORT=0 -Isrc -Ivendor/zstd -Ivendor/lz4 -Ivendor/libbsc -Ivendor/brotli/include \
            tests/kolmotest.c src/kolmo.c build/libvendor.a -llzma -lpthread -lm -lstdc++ -o kolmotest_asan
          ./kolmotest_asan
        timeout-minutes: 240
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y liblzma-dev
      - name: build vendor libraries
        run: make -j4 ARCH= build/libvendor.a
      - name: build and run fuzz targets under ASan/UBSan (bounded)
        run: |
          for t in fuzz_decompress fuzz_roundtrip; do
            gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
              -DXXH_NAMESPACE=ZSTD_ -DZSTD_MULTITHREAD -DZSTD_LEGACY_SUPPORT=0 \
              -Isrc -Ivendor/zstd -Ivendor/lz4 -Ivendor/libbsc -Ivendor/brotli/include \
              fuzz/$t.c fuzz/run_local.c src/kolmo.c build/libvendor.a \
              -llzma -lpthread -lm -lstdc++ -o $t
            ASAN_OPTIONS=detect_leaks=0 ./$t 20000
          done
        timeout-minutes: 60
