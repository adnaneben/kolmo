name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j4 ARCH=
      - name: tests (round trips in all modes, corruption fuzzing)
        run: make check
      - name: fast integer inverse (optimised and control builds) and the opt-in routes
        run: |
          make -j4 ARCH= build/test-fastint build/test-fastint-generic build/test-rc-options
          ./build/test-fastint
          ./build/test-fastint-generic
          ./build/test-rc-options
      - name: FASTA, compact ultra and tar file compatibility
        run: make -j4 ARCH= check-frontier-dna check-cm-compact check-tar-files
      - name: shared library + Python binding round trip
        run: make -j4 ARCH= lib && python3 bindings/python/test_kolmo.py && python3 tests/test_concurrent_dict.py
      - name: Rust binding round trip
        run: cargo test --manifest-path bindings/rust/Cargo.toml
      - name: research codecs and kfam (round trips, ASan/UBSan; CI runners have no GPU, so the Metal test is skipped)
        run: make -j4 ARCH= experimental-check kfam-check GPU_CHECK=
      - name: determinism (the same frames on every platform and thread count as benchmark/determinism/expected.sha256)
        run: python3 benchmark/determinism/check.py build/kolmo build/determinism
      - name: streaming round trip (multi-frame, bounded memory)
        run: |
          cat $(find src -name '*.[ch]' | sort) README.md > s.in
          for i in 1 2 3 4; do cat s.in s.in > s2.in && mv s2.in s.in; done
          ./build/kolmo -m fast -S 2 s.in s.czs
          ./build/kolmo -d s.czs s.out
          cmp s.in s.out
      - name: C references only (NO_ASM=1, no assembly kernels): kernel tests and determinism
        run: |
          rm -rf build
          make -j4 ARCH= NO_ASM=1 build/kolmo build/test-dispatch build/test-asm
          ./build/test-dispatch
          ./build/test-asm
          python3 benchmark/determinism/check.py build/kolmo build/determinism
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: build vendor libraries and the separately compiled arch objects
        run: make -j4 ARCH= build/libvendor.a build/libkolmoarch.a
      - name: resource and concurrency regressions under ASan and UBSan
        run: make -j4 ARCH= check-sanitizers
      - name: component tests of the merged features under ASan and UBSan
        run: make -j4 ARCH= check-rc
      - name: address and undefined-behaviour sanitizers
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
            -DXXH_NAMESPACE=ZSTD_ -DZSTD_MULTITHREAD -DZSTD_LEGACY_SUPPORT=0 -Isrc -Ivendor/zstd -Ivendor/lz4 -Ivendor/libbsc -Ivendor/brotli/include -Ivendor/xz \
            tests/kolmotest.c src/kolmo.c build/libkolmoarch.a build/libvendor.a -lpthread -lm -lstdc++ -o kolmotest_asan
          ./kolmotest_asan
        timeout-minutes: 240
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build vendor libraries and the separately compiled arch objects
        run: make -j4 ARCH= build/libvendor.a build/libkolmoarch.a
      - name: build and run fuzz targets under ASan/UBSan (bounded)
        run: |
          for t in fuzz_decompress fuzz_roundtrip fuzz_nplane; do
            gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
              -DXXH_NAMESPACE=ZSTD_ -DZSTD_MULTITHREAD -DZSTD_LEGACY_SUPPORT=0 \
              -Isrc -Ivendor/zstd -Ivendor/lz4 -Ivendor/libbsc -Ivendor/brotli/include -Ivendor/xz \
              fuzz/$t.c fuzz/run_local.c src/kolmo.c build/libkolmoarch.a build/libvendor.a \
              -lpthread -lm -lstdc++ -o $t
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./$t 20000
          done
        timeout-minutes: 60
