name: ci
# Pull requests and main only: a push to a branch with an open PR used to run everything twice (push and pull_request
# events), and several parallel branches queued for hours behind the runner limit. A newer push cancels the run it
# supersedes on the same PR. Other branches can run it by hand (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j4 ARCH=
      - name: tests (round trips in all modes, corruption fuzzing)
        run: make check
      - name: release-facing docs (no removed library or switch described as current; version labels agree)
        run: python3 tests/check_release_docs.py build/kolmo
      - name: fast integer inverse (optimised and control builds) and the opt-in routes
        run: |
          make -j4 ARCH= build/test-fastint build/test-fastint-generic build/test-rc-options
          ./build/test-fastint
          ./build/test-fastint-generic
          ./build/test-rc-options
      - name: FASTA, compact ultra and tar file compatibility
        run: make -j4 ARCH= check-frontier-dna check-cm-compact check-tar-files
      - name: shared library + Python binding round trip
        run: make -j4 ARCH= lib && python3 bindings/python/test_kolmo.py && python3 tests/test_concurrent.py
      - name: bindings' native copies match src (the wheel and the crate build from them)
        run: |
          cmp LICENSE bindings/python/LICENSE
          cmp NOTICE bindings/python/NOTICE
          for b in python rust; do
            diff -r -x experimental src bindings/$b/native/src
            for f in src/experimental/frontier_*; do cmp "$f" "bindings/$b/native/$f"; done
          done
      - name: Rust binding round trip
        run: cargo test --manifest-path bindings/rust/Cargo.toml
      - name: 'Rust crate: one C core per program (links = "kolmo" refuses two crate versions in one graph)'
        run: sh bindings/rust/links-check.sh
      - name: 'Rust crate: cross build compiles the C core for the target, not the host'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest)      T=x86_64-apple-darwin ;;
            ubuntu-latest)     T=aarch64-unknown-linux-gnu; sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross ;;
            ubuntu-24.04-arm)  T=x86_64-unknown-linux-gnu;  sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-x86-64-linux-gnu libc6-dev-amd64-cross ;;
          esac
          rustup target add "$T"
          cargo build --lib --manifest-path bindings/rust/Cargo.toml --target "$T" --target-dir build/rust-cross
          lib=$(find build/rust-cross/"$T"/debug/build -path '*/out/libkolmo_native.a' | head -1)   # the build script's own dir has no out/
          test -n "$lib" || { echo "libkolmo_native.a not found for $T"; exit 1; }
          case "$T" in x86_64-apple-darwin) pat='x86_64' ;; aarch64-*) pat='aarch64' ;; x86_64-*) pat='x86-64' ;; esac
          mkdir -p build/rust-cross/x && cd build/rust-cross/x && ar x "../../../$lib"
          kinds=$(file ./*.o); echo "$kinds" | sed -n 1,3p
          bad=$(echo "$kinds" | grep -v "$pat" || true)
          test -z "$bad" || { echo "objects not built for $T:"; echo "$bad"; exit 1; }
      - name: research codecs and kfam (round trips, ASan/UBSan; CI runners have no GPU, so the Metal test is skipped)
        run: make -j4 ARCH= experimental-check kfam-check GPU_CHECK=
      - name: determinism (the same frames on every platform and thread count as benchmark/determinism/expected.sha256)
        run: python3 benchmark/determinism/check.py build/kolmo build/determinism
      - name: size ledger and level order (benchmark/ledger; the per-kind diff is in the job summary) and append-only v12 pins
        run: |
          base=; pins=
          if [ -n "$GITHUB_BASE_REF" ] && git fetch -q --depth=1 origin "$GITHUB_BASE_REF"; then
            git show FETCH_HEAD:benchmark/ledger/sizes.tsv > base-sizes.tsv 2>/dev/null && base="--base base-sizes.tsv"
            git show FETCH_HEAD:tests/v12.sha256 > base-v12.sha256 2>/dev/null && pins="--base base-v12.sha256"
          fi
          python3 tests/check_v12_pinned.py $pins
          python3 benchmark/ledger/ledger.py build/kolmo $base
      - name: streaming round trip (multi-frame, bounded memory)
        run: |
          cat $(find src -name '*.[ch]' | sort) README.md > s.in
          for i in 1 2 3 4; do cat s.in s.in > s2.in && mv s2.in s.in; done
          ./build/kolmo --stream=2 s.in -o s.czs
          ./build/kolmo -d s.czs -o s.out
          cmp s.in s.out
      - name: 'C references only (NO_ASM=1, no assembly kernels): kernel tests and determinism'
        run: |
          rm -rf build
          make -j4 ARCH= NO_ASM=1 check-noasm build/kolmo build/test-dispatch build/test-asm
          ./build/test-dispatch
          ./build/test-asm
          python3 benchmark/determinism/check.py build/kolmo build/determinism
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: build the separately compiled arch objects
        run: make -j4 ARCH= build/libkolmoarch-asan.a
      - name: resource and concurrency regressions under ASan and UBSan
        run: make -j4 ARCH= check-sanitizers
      - name: component tests of the merged features under ASan and UBSan
        run: make -j4 ARCH= check-rc
      - name: address and undefined-behaviour sanitizers
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
            -Isrc \
            tests/kolmotest.c src/kolmo.c build/libkolmoarch-asan.a -lpthread -lm -o kolmotest_asan
          ./kolmotest_asan
        timeout-minutes: 240
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the separately compiled arch objects
        run: make -j4 ARCH= build/libkolmoarch-asan.a
      - name: build and run fuzz targets under ASan/UBSan (bounded)
        run: |
          for t in fuzz_decompress fuzz_roundtrip fuzz_nplane fuzz_limited; do
            gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off \
              -Isrc -Ifuzz \
              fuzz/$t.c fuzz/run_local.c src/kolmo.c build/libkolmoarch-asan.a \
              -lpthread -lm -o $t
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./$t 20000
          done
          # version-12 frames of every mode (the frame target recomputes the header CRC after mutation, so the
          # mutations reach the block decoders): a bounded mutation campaign over the seeds; the release directories'
          # frames too (0.0.2 codecs and CZNS streams), less the slow 8/9/ultra ones (their ASan seed pass alone took minutes)
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./fuzz_decompress -300 fuzz/corpus/v12/* tests/v12/*.kolmo \
            $(find tests/v12/r* -name '*.kolmo' ! -name '*.L[89U].kolmo' -size -64k | sort)
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off -Isrc \
            fuzz/fuzz_native.c fuzz/run_local.c build/libkolmoarch-asan.a -lpthread -lm -o fuzz_native
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./fuzz_native -120 fuzz/corpus/native/*
      - name: rc3 decoders (codecs 17-26, KEXT/IDX1/DDP1, KPF1 and --target) under ASan/UBSan (bounded)
        run: |
          # these harnesses include src/kolmo.c themselves; KOLMO_FUZZ_NO_CM keeps the context-mixing setup out
          for t in fuzz_codecs fuzz_ext fuzz_profile; do
            gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off -DKOLMO_FUZZ_NO_CM \
              -Isrc -Ifuzz \
              fuzz/$t.c fuzz/run_local.c build/libkolmoarch-asan.a -lpthread -lm -o $t
            n=20000; [ $t = fuzz_codecs ] && n=5000      # its round trips encode (block sorting, audio, GR6+)
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./$t $n
          done
        timeout-minutes: 60
