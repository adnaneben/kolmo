name: P2-E14 production-format type-first frames on the P2-E10 cohort, production CLI decode
# Research only. Same pinned rivals, inputs and harness as N1 (baselines.py imported unchanged by
# research/codec/P2-E14/run_e14.py) on the P2-E10 cohort; research encoder p2e13 (P2-E13) writes CZN1 frames that the
# production kolmo CLI decodes. Development data.
on:
  push:
    branches: [fix/planner-record-ownership-isolated-20261112]
    paths: [.github/workflows/p2e14-cli.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p2e14-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e3:
    if: github.repository == 'adnaneben/kolmo'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze source identity and test harnesses
        run: |
          set -euo pipefail
          mkdir -p ev
          git diff --exit-code 2f3308a3380a140ad0f6873ae228de7715e5eef5 -- src vendor Makefile tests benchmark/accept/TARGETS.md
          git rev-parse HEAD > ev/COMMIT.txt
          { uname -a; gcc --version; cmake --version; nproc; lscpu; } > ev/environment.txt
          sha256sum research/codec/N1-baselines/baselines.py research/codec/P2-E14/run_e14.py research/codec/P2-E14/PROTOCOL.md research/codec/P2-E10/prepare_e10.py research/codec/P2-E13/p2e13.c research/codec/P2-E13/rans1.inc research/codec/P2-E11/p2e11.c research/codec/P2-E11/tpframe.inc research/codec/P2-E9/fastint9.inc research/codec/P2-E9/fastchoose.inc research/codec/P2-E2/p2e2.c research/codec/P2-E2/fastint.inc research/codec/E02C-harness/harness/e02c.c > ev/source-hashes.txt
          python -m unittest discover -s research/codec/N1-baselines -p 'test_*.py' 2>&1 | tail -3 | tee ev/unit-tests.log
          sudo apt-get update -qq && sudo apt-get install -y liblzma-dev
      - uses: actions/checkout@v4
        with:
          repository: meta/openzl
          ref: 32246b48faee46807f84183dac4db479089f5445
          path: _rivals/openzl
          persist-credentials: false
      - name: Build pinned rivals, Kolmo and p2e13 with N1's flags
        run: |
          set -euo pipefail
          test "$(git -C _rivals/openzl rev-parse HEAD)" = 32246b48faee46807f84183dac4db479089f5445
          FLAGS='-O3 -DNDEBUG -fno-plt -ffp-contract=off'
          cmake -S _rivals/openzl -B _rivals/openzl/build -DCMAKE_BUILD_TYPE=Release -DOPENZL_BUILD_TESTS=OFF -DOPENZL_BUILD_EXAMPLES=OFF -DOPENZL_BUILD_BENCHMARKS=OFF -DOPENZL_BUILD_PARQUET_TOOLS=OFF -DOPENZL_ALLOW_INTROSPECTION=OFF -DZSTD_BUILD_SHARED=OFF -DCMAKE_C_FLAGS_RELEASE="$FLAGS" -DCMAKE_CXX_FLAGS_RELEASE="$FLAGS" > ev/openzl-configure.log 2>&1
          cmake --build _rivals/openzl/build --target zli --parallel 2 > ev/openzl-build.log 2>&1
          make -C _rivals/openzl/deps/zstd/programs -j2 zstd CFLAGS="$FLAGS" > ev/zstd-build.log 2>&1
          make -j2 build/kolmo CFLAGS="$FLAGS" > ev/kolmo-build.log 2>&1
          make build/libvendor.a > ev/libvendor-build.log 2>&1
          DEFS="-DXXH_NAMESPACE=ZSTD_ -DZSTD_MULTITHREAD -DZSTD_LEGACY_SUPPORT=0"; INC="-Isrc -Ivendor/zstd -Ivendor/lz4 -Ivendor/libbsc -Ivendor/brotli/include"
          gcc $FLAGS $DEFS $INC research/codec/P2-E13/p2e13.c build/libvendor.a -o build/p2e13 -llzma -lpthread -lm -lstdc++ > ev/p2e13-build.log 2>&1
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -ffp-contract=off $DEFS $INC research/codec/P2-E13/p2e13.c build/libvendor.a -o build/p2e13-asan -llzma -lpthread -lm -lstdc++ >> ev/p2e13-build.log 2>&1
          { _rivals/openzl/build/cli/zli --version; _rivals/openzl/deps/zstd/programs/zstd --version; sha256sum _rivals/openzl/build/cli/zli _rivals/openzl/deps/zstd/programs/zstd build/kolmo build/p2e13; } > ev/toolchain.txt
      - name: Fetch the registered E02E/E02F/E02G sources and build the P2-E10 cohort
        run: |
          set -euo pipefail
          python -m pip install -q 'numpy==2.1.3'
          for e in E02E E02F E02G; do sh research/codec/$e/fetch.sh "$RUNNER_TEMP/dl_$e" > ev/fetch_$e.log 2>&1; cp "$RUNNER_TEMP/dl_$e/DOWNLOAD.sha256" ev/DOWNLOAD_$e.sha256; done
          for e in E02E E02F E02G; do python research/codec/$e/prepare.py "$RUNNER_TEMP/dl_$e" "$RUNNER_TEMP/out_$e" "$RUNNER_TEMP/out_$e/manifest.json" > ev/prepare_$e.log 2>&1 || { tail -20 ev/prepare_$e.log; exit 1; }; done
          python research/codec/P2-E10/prepare_e10.py "$RUNNER_TEMP/out_E02E" "$RUNNER_TEMP/out_E02F" "$RUNNER_TEMP/out_E02G" "$RUNNER_TEMP/dl_E02F" "$RUNNER_TEMP/dl_E02G" ev/prepared | tee ev/prepare_e10.log
      - name: Sanitizer-built research encoder, production CLI decoder, every input
        run: |
          set -euo pipefail
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          for f in ev/prepared/inputs/*; do
            for c in tp_phuf tp_phuf_pg16 tp_prod3 tb_best tb_lazy tp_pent tp_arch19; do build/p2e13-asan enc $c "$f" "$RUNNER_TEMP/x.czn"; build/kolmo -d -T1 "$RUNNER_TEMP/x.czn" "$RUNNER_TEMP/y"; cmp "$f" "$RUNNER_TEMP/y"; echo "asan-ok $(basename $f) $c"; done
          done > ev/asan.log; grep -c asan-ok ev/asan.log
      - name: Complete CLI comparison and confirmation
        run: |
          set -euo pipefail
          T="--zstd _rivals/openzl/deps/zstd/programs/zstd --openzl _rivals/openzl/build/cli/zli --kolmo build/kolmo --tb build/p2e13"
          python research/codec/P2-E14/run_e14.py run ev/prepared ev/first $T
          python research/codec/P2-E14/run_e14.py run ev/prepared ev/confirmation $T --seed 20261113
          python research/codec/P2-E14/run_e14.py confirm ev/first ev/confirmation > ev/confirmation.json
          git diff --exit-code 2f3308a3380a140ad0f6873ae228de7715e5eef5 -- src vendor Makefile tests benchmark/accept/TARGETS.md
      - name: Hash and print compact evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,base64,lzma
          p=pathlib.Path('ev'); p.mkdir(exist_ok=True)
          m={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file() and f.name!='MANIFEST.json' and 'prepared/inputs' not in str(f) and not f.name.endswith(('.frame','.decoded'))}
          (p/'MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          for name in ['COMMIT.txt','toolchain.txt','source-hashes.txt','unit-tests.log','confirmation.json','prepare_e10.log','DOWNLOAD_E02E.sha256','DOWNLOAD_E02F.sha256','DOWNLOAD_E02G.sha256','MANIFEST.json']:
              f=p/name
              if f.exists(): print(f'=== BEGIN {name}'); print(f.read_text(),end=''); print(f'=== END {name}')
          for name in ['first/records.json','confirmation/records.json','first/timings.jsonl','confirmation/timings.jsonl','prepared/manifest.json','asan.log','first/tables.md','confirmation/tables.md']:
              f=p/name
              if f.exists(): print(f'=== BEGIN base64-xz {name}'); print(base64.b64encode(lzma.compress(f.read_bytes(),preset=9)).decode()); print(f'=== END base64-xz {name}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2e14-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ev/
            !ev/**/*.frame
          retention-days: 30
          if-no-files-found: error
